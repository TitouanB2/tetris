<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#111827">
        <title>Tetris</title>
        <link rel="stylesheet" href="./styles.css">
        <script type="module" src="./main.js"></script>
    </head>
    <body>
        <main class="game">
            <header class="game__header">
                <h1>Tetris</h1>
                <p>Place les pièces et complète des lignes.</p>
            </header>

            <section id="mode-selection" class="mode-selection" aria-labelledby="mode-title">
                <h2 id="mode-title">Choisir un mode</h2>
                <div class="mode-selection__buttons">
                    <button type="button" data-player-count="1">Solo</button>
                    <button type="button" data-player-count="2">VS 1 adversaire</button>
                    <button type="button" data-player-count="3">VS 2 adversaires</button>
                    <button type="button" data-player-count="4">VS 3 adversaires</button>
                </div>
            </section>

            <section id="game-view" class="game-view" aria-label="Jeu de Tetris" hidden>
                <div id="players" class="boards"></div>
                <p id="game-status" class="game__status" aria-live="polite"></p>
                <section id="podium" class="podium" aria-live="polite" hidden>
                    <h2 id="podium-title"></h2>
                    <ol id="podium-list"></ol>
                </section>
                <div class="game__controls">
                    <button id="start" type="button">Démarrer</button>
                    <button id="pause" type="button" disabled>Pause</button>
                    <button id="restart" type="button">Recommencer</button>
                    <button id="change-mode" type="button">Changer de mode</button>
                </div>
            </section>
        </main>
    </body>
</html>
